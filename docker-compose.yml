services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
        VITE_API_TIMEOUT_MS: ${FRONTEND_API_TIMEOUT_MS:-15000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    # Dockerfile बाट image बनाऊ।
    container_name: node_auth_api

    ports:
      - "127.0.0.1:5000:5000"
      #  artha compuer 5000-> docker 5000

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379

    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

    restart: unless-stopped


  mongo:
    image: mongo:8

    container_name: node_auth_mongo

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


volumes:
  mongo_data:
